<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Bloqueado · Focus Blocker</title>
  <link rel="stylesheet" href="blocked.css" />
</head>
<body>
  <main>
    <div class="emoji" aria-hidden="true">🚫</div>
    <h1>Esta página está bloqueada</h1>
    <p class="domain" id="domain"></p>
    <p class="message">Volvé al foco. Vos mismo agregaste este sitio.</p>
    <div class="actions">
      <button id="back-btn">← Volver atrás</button>
      <button id="close-btn" class="secondary">Cerrar pestaña</button>
    </div>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
