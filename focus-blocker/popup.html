<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Focus Blocker</h1>
    <p class="subtitle">Sitios bloqueados</p>
  </header>

  <form id="add-form" autocomplete="off">
    <input
      type="text"
      id="site-input"
      placeholder="ej. youtube.com"
      required
      spellcheck="false"
    />
    <button type="submit">Añadir</button>
  </form>

  <ul id="sites-list"></ul>

  <footer>
    <small><span id="count">0</span> sitios bloqueados</small>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
