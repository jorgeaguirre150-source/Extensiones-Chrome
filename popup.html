<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>FocusGuard</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="ambient"></div>

  <header class="top">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <circle cx="12" cy="12" r="10" stroke="#4ade80" stroke-width="1.2" fill="none" opacity="0.35" />
        <circle cx="12" cy="12" r="6" stroke="#4ade80" stroke-width="1.2" fill="none" opacity="0.7" />
        <circle cx="12" cy="12" r="2.4" fill="#4ade80" />
      </svg>
      <span>FocusGuard</span>
    </div>
    <button class="icon-link" id="open-options" title="Ajustes ampliados" aria-label="Abrir opciones">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M7 17l5-5-5-5M13 17l5-5-5-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="status" role="tab">Estado</button>
    <button class="tab" data-tab="schedules" role="tab">Horarios</button>
    <button class="tab" data-tab="sites" role="tab">Webs</button>
    <button class="tab" data-tab="settings" role="tab">Ajustes</button>
    <span class="tab-indicator" aria-hidden="true"></span>
  </nav>

  <main class="panels">
    <section class="panel active" data-panel="status">
      <div class="status-card" id="status-card">
        <div class="status-pulse" aria-hidden="true">
          <span class="pulse-dot"></span>
          <span class="pulse-ring"></span>
        </div>
        <div class="status-text">
          <h2 id="status-title">—</h2>
          <p id="status-sub">—</p>
        </div>
      </div>

      <div class="countdown-card hidden" id="status-countdown">
        <div class="countdown-track">
          <div class="countdown-fill" id="countdown-fill"></div>
        </div>
        <div class="countdown-row">
          <span class="countdown-label">Tiempo restante</span>
          <span class="countdown-value mono" id="countdown-value">--:--:--</span>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card stat-streak">
          <div class="stat-head">
            <span class="stat-label">Racha</span>
            <svg viewBox="0 0 24 24" width="14" height="14" class="stat-icon-svg" aria-hidden="true">
              <path d="M12 2s4 4 4 8a4 4 0 0 1-8 0c0-2 1-3 2-4 0 2 2 2 2 4z M8 14c0 3 2 6 4 6s4-3 4-6c0 2-2 4-4 4s-4-2-4-4z" fill="#fbbf24"/>
            </svg>
          </div>
          <div class="stat-value mono" id="streak-current">0</div>
          <div class="stat-foot">Mejor: <span class="mono" id="streak-best">0</span></div>
        </div>
        <div class="stat-card stat-focus">
          <div class="stat-head">
            <span class="stat-label">Min hoy</span>
            <svg viewBox="0 0 24 24" width="14" height="14" class="stat-icon-svg" aria-hidden="true">
              <circle cx="12" cy="13" r="7" stroke="#4ade80" stroke-width="1.6" fill="none"/>
              <path d="M12 9v4l2.5 1.5" stroke="#4ade80" stroke-width="1.6" stroke-linecap="round" fill="none"/>
              <path d="M9 3h6" stroke="#4ade80" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="stat-value mono" id="focus-today">0</div>
          <div class="stat-foot">Acumulado hoy</div>
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-header">
          <span class="chart-title">Últimos 7 días</span>
          <span class="chart-sub mono"><span id="chart-total">0</span> min</span>
        </div>
        <div class="chart" id="chart-bars"></div>
      </div>
    </section>

    <section class="panel" data-panel="schedules">
      <button class="btn btn-primary btn-full" id="add-schedule-btn">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Añadir bloque</span>
      </button>
      <ul class="schedule-list" id="schedule-list"></ul>
    </section>

    <section class="panel" data-panel="sites">
      <form class="add-site-form" id="add-site-form" autocomplete="off">
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" width="14" height="14" class="input-icon" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input type="text" id="site-input" placeholder="ej. youtube.com" required spellcheck="false" />
        </div>
        <button type="submit" class="btn btn-primary">Añadir</button>
      </form>
      <div class="chips">
        <button class="chip" data-preset="social">Redes sociales</button>
        <button class="chip" data-preset="video">Vídeo</button>
        <button class="chip" data-preset="news">Noticias</button>
      </div>
      <ul class="site-list" id="site-list"></ul>
    </section>

    <section class="panel" data-panel="settings">
      <div class="setting-section">
        <label class="toggle-row">
          <div class="toggle-info">
            <span class="toggle-name">Mensajes motivacionales</span>
            <span class="toggle-sub">Rotación de 40 frases en bloqueo</span>
          </div>
          <input type="checkbox" id="setting-motivational" />
        </label>
        <label class="toggle-row">
          <div class="toggle-info">
            <span class="toggle-name">Sonidos</span>
            <span class="toggle-sub">Feedback auditivo (futuro)</span>
          </div>
          <input type="checkbox" id="setting-sound" />
        </label>
      </div>

      <div class="setting-section">
        <span class="section-title">Datos</span>
        <div class="settings-actions">
          <button class="btn btn-secondary" id="export-btn">Exportar JSON</button>
          <button class="btn btn-secondary" id="import-btn">Importar JSON</button>
          <input type="file" id="import-file" accept="application/json" hidden />
        </div>
      </div>

      <div class="setting-section">
        <span class="section-title">Zona peligrosa</span>
        <div class="settings-actions">
          <button class="btn btn-danger-soft" id="reset-streak-btn">Resetear racha</button>
          <button class="btn btn-danger-soft" id="reset-all-btn">Restablecer todo</button>
        </div>
      </div>

      <div class="footer-meta">
        <span class="mono">FocusGuard v1.0.0</span>
        <a href="#" id="options-link">Opciones ampliadas →</a>
      </div>
    </section>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <h3 id="modal-title">Nuevo bloque</h3>
      <label class="field">
        <span>Nombre</span>
        <input type="text" id="modal-name" placeholder="Mañana profunda" maxlength="40" />
      </label>
      <div class="field-row">
        <label class="field">
          <span>Inicio</span>
          <input type="time" id="modal-start" />
        </label>
        <label class="field">
          <span>Fin</span>
          <input type="time" id="modal-end" />
        </label>
      </div>
      <div class="field">
        <span>Días</span>
        <div class="day-picker" id="modal-days">
          <button type="button" data-day="1">L</button>
          <button type="button" data-day="2">M</button>
          <button type="button" data-day="3">X</button>
          <button type="button" data-day="4">J</button>
          <button type="button" data-day="5">V</button>
          <button type="button" data-day="6">S</button>
          <button type="button" data-day="0">D</button>
        </div>
        <div class="day-presets">
          <button type="button" data-preset="weekdays">L–V</button>
          <button type="button" data-preset="weekend">S–D</button>
          <button type="button" data-preset="all">Todos</button>
        </div>
      </div>
      <div id="modal-error" class="modal-error hidden"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="modal-cancel">Cancelar</button>
        <button class="btn btn-primary" id="modal-save">Guardar</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
